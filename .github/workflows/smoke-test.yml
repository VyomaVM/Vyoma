name: Smoke Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev build-essential libssl-dev protobuf-compiler libdevmapper-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Cloud Hypervisor v54.0 Runtime
        run: |
          mkdir -p bin
          if [ ! -f "bin/cloud-hypervisor" ]; then
            wget -q -O bin/cloud-hypervisor https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/v54.0/cloud-hypervisor-static
            chmod +x bin/cloud-hypervisor
          fi
          echo "4f4f98a3d661a40f3e5272627cc895a1b2e525f2f6bedf5f895f9cd21ba5c65b  bin/cloud-hypervisor" | sha256sum -c -
          ./bin/cloud-hypervisor --version

      - name: Build DEB package
        run: |
          chmod +x packaging/deb/build.sh
          ./packaging/deb/build.sh

      - name: Verify package created
        run: |
          ls -la dist/
          ls -la dist/vyoma_*.deb

      - name: Upload package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyoma-deb
          path: dist/vyoma_*.deb
          retention-days: 1

  smoke-test-remote:
    needs: smoke-test
    runs-on: [self-hosted, vyoma-kvm-runner]
    timeout-minutes: 30

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: vyoma-deb

      - name: Display package
        run: |
          ls -la *.deb

      - name: Run smoke test
        run: |
          chmod +x tests/smoke/install-and-run.sh
          sudo tests/smoke/install-and-run.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            /tmp/vyoma-smoke-test-*.log
            /tmp/vyomad.log
          retention-days: 7

      - name: Report status
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Smoke test passed"
          else
            echo "Smoke test failed"
            exit 1
          fi