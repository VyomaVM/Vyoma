name: Cross-Platform CLI & Core Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  cli-matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extra_target: ""
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extra_target: ""
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            extra_target: ""
          - name: macOS Apple Silicon (M1/M2/M3+) & Intel
            os: macos-latest
            target: aarch64-apple-darwin
            extra_target: x86_64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run pure-Rust & CLI tests
        run: |
          cargo test -p vyoma-api --lib
          cargo test -p vyoma --bin vyoma --target ${{ matrix.target }}

      - name: Verify extra target build (Intel macOS)
        if: matrix.extra_target != ''
        run: |
          rustup target add ${{ matrix.extra_target }}
          cargo check -p vyoma-api -p vyoma --target ${{ matrix.extra_target }}

      - name: Verify CLI offline help & dry-run machine plans
        run: |
          cargo run -p vyoma --target ${{ matrix.target }} -- context --help
          cargo run -p vyoma --target ${{ matrix.target }} -- remote --help
          cargo run -p vyoma --target ${{ matrix.target }} -- machine init ci-m1 --driver lima-tcg --arch aarch64 --dry-run
          cargo run -p vyoma --target ${{ matrix.target }} -- machine init ci-m3 --driver lima-vz --arch aarch64 --dry-run
          cargo run -p vyoma --target ${{ matrix.target }} -- machine init ci-win --driver wsl2 --dry-run
