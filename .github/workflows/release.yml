name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev build-essential rpm libssl-dev protobuf-compiler libdevmapper-dev virtiofsd

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Verify Cloud Hypervisor v54.0 Runtime
        run: |
          mkdir -p bin
          if [ ! -f "bin/cloud-hypervisor" ]; then
            wget -q -O bin/cloud-hypervisor https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/v54.0/cloud-hypervisor-static
            chmod +x bin/cloud-hypervisor
          fi
          echo "4f4f98a3d661a40f3e5272627cc895a1b2e525f2f6bedf5f895f9cd21ba5c65b  bin/cloud-hypervisor" | sha256sum -c -
          ./bin/cloud-hypervisor --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build UI
        run: |
            cd ui
            npm install
            npm run build
            cd ..

      - name: Build Debian Package
        run: ./packaging/deb/build.sh

      - name: Build RPM Package
        run: ./packaging/rpm/build.sh

      - name: Verify Packages
        run: |
          echo "DEB files:" && ls -la dist/*.deb || echo "No DEB files found"
          echo "RPM files:" && ls -la dist/*.rpm || echo "No RPM files found"

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true
          draft: false
          prerelease: false
